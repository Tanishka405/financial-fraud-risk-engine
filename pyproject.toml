[project]
name = "fraud-detection"
version = "0.1.0"
description = "Graph-based anomaly detection and AML risk scoring for INR transaction data (academic project)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "networkx>=3.0",
    "PyYAML>=6.0",
    "python-dateutil>=2.8",
    "pytz>=2023.3",
    "scipy>=1.11",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=7.4",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]

[tool.setuptools.packages.find]
include = ["core*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
